{% for item in data %}
    <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ item.libelle }}</td>
        <td>{{ item.description }}</td>
        <td>
            <button type="button"
                    class="btn btn-warning btn-sm js-update-entity"
                    data-url="{% url url_update item.id %}" title="Modifier" data-toggle="tooltip" data-original-title="Modifier">
                <span class="glyphicon glyphicon-pencil"></span> 
            </button>
            <button type="button"
                    class="btn btn-danger btn-sm js-delete-entity"
                    data-url="{% url url_delete item.id %}" title="Supprimer" data-toggle="tooltip" data-original-title="Supprimer">
                <span class="glyphicon glyphicon-trash"></span> 
            </button>
        </td>
    </tr>
{% empty %}
    {% comment %} <tr> <td colspan="4" class="text-center background-warning" > Aucune donnée disponible </td> </tr> {% endcomment %}
{% endfor %}
