{% load widget_tweaks %}

{% for field in form %}
    <div class="form-group{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% comment %} {% if field.class %} {% render_field field %} {% else %} {% render_field field class="form-control"  %} {% endif %} {% endcomment %}
    {% render_field field %} 
    {% for error in field.errors %}
        <p class="help-block">{{ error }}</p>
    {% endfor %}
    </div>
{% endfor %}
