<form method="post" action="{% url 'tache_ml_delete' tache_ml.id %}" class="js-tache_ml-delete-form">
  {% csrf_token %}
    <div class="modal-header">
      <h5 class="modal-title">Suppression de tache de ML</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
      </button>
  </div>
  <div class="modal-body">
    <p class="lead">Etes vous sure de vouloir supprimer cet enregistrement <strong>{{ tache_ml.title }}</strong>?</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal">Annuler</button>
    <button type="submit" class="btn btn-danger">Supprimer cette tache_ml</button>
  </div>
</form>
