{% for item in data %}
    <tr>
        <td>{{ forloop.counter }}</td>
        {% include path_table_body_fragment %}}
        <td>
            <button type="button"
                    class="btn btn-warning btn-sm js-update-entity" data-url="{% url url_update item.id %}" title="Modifier" data-bs-toggle="tooltip" title="Modifier">
                    <i class="bi bi-pencil-fill"></i>
            </button>
            <button type="button"
                    class="btn btn-danger btn-sm js-delete-entity" data-url="{% url url_delete item.id %}" title="Supprimer" data-bs-toggle="tooltip" title="Supprimer">
                    <i class="bi bi-trash-fill"></i>
            </button>
        </td>
    </tr>
{% empty %}
    {% comment %} <tr> <td colspan="4" class="text-center background-warning" > Aucune donnée disponible </td> </tr> {% endcomment %}
{% endfor %}
