{% load static %}
{% comment %} load settinf constant in template max_length {% endcomment %}
<script type="text/javascript">

	
	class FileUpload {
		constructor(input) {
			this.input = input
			this.max_length = 1024 * 1024 * 10; // 10 mb
		}
	
		upload() {
			this.create_progress_bar();
			this.initFileUpload();
		}
		
		initFileUpload() {
			this.file = this.input.files[0];
			this.upload_file(0, null);
		}

		upload_file(start, path) {
			var end;
			var self = this;
			var chemin = path;
			var formData = new FormData();
			var nextChunk = start + this.max_length + 1;
			var currentChunk = this.file.slice(start, nextChunk);
			var uploadedChunk = start + currentChunk.size
			if (uploadedChunk >= this.file.size) {
				end = 1;
			} else {
				end = 0;
			}
			formData.append('file', currentChunk);
			formData.append('filename', this.file.name);
			formData.append('end', end);
			formData.append('path', chemin);
			formData.append('nextSlice', nextChunk);
			{% comment %} $('.filename').text(this.file.name) {% endcomment %}
			$('.textbox').text("Fichier en cours d'envoie...")
			$.ajaxSetup({
			// make sure to send the header
				headers: {
					"X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
				}
			});

			$.ajax({
				xhr: function () {
					var xhr = new XMLHttpRequest();
					xhr.upload.addEventListener('progress', function (e) {
						if (e.lengthComputable) {
							if (self.file.size < self.max_length) {
								var percent = Math.round((e.loaded / e.total) * 100);
							} else {
								var percent = Math.round((uploadedChunk / self.file.size) * 100);
							}
							$('.progress-bar').css('width', percent + '%')
							$('.progress-bar').text(percent + '%')
						}
					});
					return xhr;
				},
	
				url: "{% url 'upload_dataset' %}",
				type: 'POST',
				dataType: 'json',
				cache: false,
				processData: false,
				contentType: false,
				data: formData,
				error: function (xhr) {
					console.log('BAD')
					alert(xhr.statusText);
				},
				success: function (res) {
					if (nextChunk < self.file.size) {
						// upload file in chunks
						chemin = res.chemin
						self.upload_file(nextChunk, chemin)
					} else {
						let df = JSON.parse(res.df)
						FileUpload.init_table(df['data'], df['columns'], res.cols_info)
						$('.textbox').text(res.msg)

						$('#histogrammes').html(res.img_block)

						$('#select-variable').empty().trigger("change")
						let collection = df['columns']
						$('#select-variable').append(new Option('non défini', 'non défini', false, true))
						for (var j = 0; j < collection.length; j++) {
							$('#select-variable').append(new Option(collection[j], collection[j], false, false))
						}
					}
				}
			});

		};

		create_progress_bar() {
			var progress = `<div class="file-icon">
								<i class="fa fa-file-o" aria-hidden="true"></i>
							</div>
							<div class="file-details">
								{% comment %} <p class="filename"></p> {% endcomment %}
								<small class="textbox"></small>
								<div class="progress" style="margin-top: 5px;">
									<div class="progress-bar bg-success" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
									</div>
								</div>
							</div>`
			document.getElementById('uploaded_files').innerHTML = progress
		}

							{% for key, value in scaller %}
							$(select).append('<option value="{{key}}"> {{value|safe}} </option>')
							{% endfor %}
				
						});

						this.api().columns().every(function (index) {
							var column = this;
				
							var select = $(`<br><select id="col-ten-${cols_name[index]}" class="form-control-xs" style="width:110px";"><option value="None"></option></select>`)
								.appendTo($("#filters").find("th").eq(column.index()))

								});

							$(select).append('<option value="{{key}}"> {{value|safe}} </option>')
							{% endfor %}
				
						});
					},
					data: data,
					{% comment %} columns: columns {% endcomment %}
				});
				
				console.log(preprocessing)

					$('#col-tdd-'+key).val(value['type']).change()

					$('#col-tme-'+key).val(value['scaller']).change()
					$('#col-ten-'+key).val(value['encoder']).change()
				}
				window.columns = columns
				window.table.columns.adjust().draw(); // Redraw the DataTable
		}
