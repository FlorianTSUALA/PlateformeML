{% for key, value in images %}
<div class="col">
    <div class="card radius-10">
        <div class="card-body">
            <img src="{{value}}" class="card-img-top" alt="{{key}}" width="100%">
            <hr class="my-2">
            <div class="form-check">
                {% comment %} <small class="mb-0"><i class="bi bi-arrow-up"></i> <span>{{key}}</span></small> {% endcomment %}
                <input class="form-check-input" type="checkbox" name="target" value="{{key}}" id="flexCheckDefault" checked required>
                <label class="form-check-label" for="flexCheckDefault">{{key}}</label>
            </div>
        </div>
    </div>
</div>
{% endfor %}
