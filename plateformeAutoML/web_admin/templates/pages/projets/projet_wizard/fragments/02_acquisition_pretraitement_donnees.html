{% comment %} <div id="step-02" class="page-section-stepper container py-2"> {% endcomment %}
    <h2 class="font-weight-light text-center text-muted py-3">Acquisition & Prétraitement des données</h2>
    <div class="row">
        <div class="col-lg-12 mx-auto">
            <div class="card">
                <div class="card-body">
                    <div class="row g-3">
                        <h5 class="mb-2 mb-sm-0">Chargement des données</h5>
                        <hr>
                        <form class="form" enctype="multipart/form-data" method="POST" action="">
                            {% csrf_token %}
                            <label class="form-label" for="file2upload">selectionnez un fichier (xls, xlsx, csv, npy)</label>
                            <div class="input-group">
                                <input type="file" class="form-control" id="file2upload" placeholder="Choisir un jeu de données." aria-describedby="file2upload" aria-label="Upload"  accept=".xlsx, .xls, .csv">
                                <button class="btn btn-primary" type="submit" id="submit_upload_file">Charger votre fichier</button>
                            </div>
                        </form>
                        <div id="uploaded_files"></div>
                    </div><!--end row-->
                    <br>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="dataset" class="table table-striped table-bordered" style="width:100%">
                                <thead>
                                    <tr id="filters"></tr>
                                </thead>
                                <tbody></tbody>
                                <tfoot></tfoot>
                            </table>
                        </div>
                    </div>
                    <div class="card-header py-3 bg-transparent"> 
                        <div class="d-sm-flex align-items-center">
                            <h5 class="mb-2 mb-sm-0">Distribution des variables & Selection des varaiables </h5>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="p-4  rounded">
                            <div id="histogrammes" class="row row row-cols-1  row-cols-sm-2 row-cols-lg-4 row-cols-xl-4 row-cols-xxl-5 g-3"></div><!--end row-->
                        
                        </div>
                    </div>
                </div>
                <div class="card-footer py-3 bg-transparent"> 
                    <div class="d-sm-flex align-items-center">
                        <div class="ms-auto">
                            <button type="button" class="btn btn-warning prev-btn">Revenir</button>
                            {% comment %} <button type="button" class="btn btn-secondary">Annuler</button> {% endcomment %}
                            <button type="button" id="btn_save_info_preprocessing" class="btn btn-primary">Enregistrer les informations de pretraitement</button>
                            <button type="button" class="btn btn-warning next-btn">Poursuivre</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% comment %} </div> {% endcomment %}
