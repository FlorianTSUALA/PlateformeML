{% load static %}
{% comment %} <div id="step-01" class="page-section-stepper container py-2"> {% endcomment %}
    <h2 class="font-weight-light text-center text-muted py-3">Informations générales</h2>
    <div class="row">
        <div class="col-lg-12 mx-auto">
            <div class="card">
                <div class="card-body">
                    <form id="form_info_projet">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-12 col-lg-8">
                                <div class="card shadow-none bg-light border">
                                    <div class="card-body">
                                    <form class="row g-3">
                                        <input type="hidden" class="" style="display: none" id='projet_id' name="projet_id" value="{% if id is None %}0{% else %}{{ id }}{% endif %}" />
                                        <div class="col-12">
                                        <label class="form-label">Titre</label>
                                        <input type="text" class="form-control" id='projet_titre' name="titre" placeholder="titre du projet">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Mots clés</label>
                                            <input type="text" id='projet_nots_cles' name="mots_cles" class="form-control" value="Regression, School, Furniture"  data-role="tagsinput" placeholder="mots clés">
                                        </div>
                                        <div class="col-12">
                                        <label class="form-label">Description </label>
                                        <textarea class="form-control" id='projet_description' name="description" placeholder="description du projet" rows="4" cols="4"></textarea>
                                        </div>
                                    </form>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-lg-4">
                                <div class="card shadow-none bg-light border">
                                    <div class="card-body">
                                        <div class="row g-3">
                                            <div class="col-12">
                                                <label class="form-label">Status</label>
                                                <select class="form-select" name="statut" id="statut">
                                                    {% for key, value in status%}
                                                        <option value="{{ key }}" selected>{{ value }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label">Image d'intenfication</label>
                                                <input class="form-control" id="image" name="image" type="file">
                                            </div>
                                            <div class="col-12"  style="text-align: center;">
                                                <img src="{% static 'template/assets/images/upload.png' %}" class="img-fluid mb-3" style="max-height:130px" alt="">
                                            </div>
                                        </div><!--end row-->
                                    </div>
                                </div>  
                            </div>

                        </div><!--end row-->
                    </form><!--end row-->
                </div>
                <div class="card-footer py-3 bg-transparent"> 
                    <div class="d-sm-flex align-items-center">
                        <div class="ms-auto">
                            {% comment %} <button id="btn_reset_form_info_projet" type="button" class="btn btn-secondary">Annuler</button> {% endcomment %}
                            <button id="btn_submit_form_info_projet" type="button" class="btn btn-primary">Enregistrer les informations du projet</button>
                            <button type="button" class="btn btn-warning next-btn">Poursuivre</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% comment %} </div> {% endcomment %}
